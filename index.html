<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prode en vivo</title>
<style>
body{font-family:Arial;background:#f8fafc;padding:20px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border:1px solid #ddd}
th{background:#eee}
</style>
</head>
<body>
<h1>Ranking en vivo</h1>
<table>
<thead><tr><th>#</th><th>Empleado</th><th>Puntos</th></tr></thead>
<tbody id="ranking"></tbody>
</table>
<script>
const resultadosURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTN00doLz5fBvG_rfm9a8mWZuOR04KsIsxCIoqHSjwd5uVolmQK0UTmHfZ3uMZfB1DyuBuEJvVeOcDI/pub?output=csv";
const pronosURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRHsLwPCbEOUMSL0V6LNkIAPs4hx8TXa7xnbrmLMLSgL-BMHzLtA4W8j4qJkIMCq72A3cX4Yz-BXMyN/pub?output=csv";

function parseCSV(t){const r=t.trim().split("\n");const h=r[0].split(",");return r.slice(1).map(l=>{const v=l.split(",");let o={};h.forEach((k,i)=>o[k.trim()]=v[i]);return o})}
function winner(a,b){return a>b?"L":a<b?"V":"E"}

async function load(){
const res=await fetch(resultadosURL);const pro=await fetch(pronosURL);
const resultados=parseCSV(await res.text());
const pronos=parseCSV(await pro.text());
let ranking={};

pronos.forEach(p=>{
const nombre=p["Nombre"]||p["Nombre y apellido"];
if(!ranking[nombre])ranking[nombre]=0;

resultados.forEach((r,i)=>{
const gl=Number(r.goles_local);const gv=Number(r.goles_visitante);
if(isNaN(gl)||isNaN(gv))return;

const values=Object.values(p);
const pl=Number(values[(i*2)+1]);
const pv=Number(values[(i*2)+2]);

if(pl===gl && pv===gv)ranking[nombre]+=2;
else if(winner(pl,pv)===winner(gl,gv))ranking[nombre]+=1;
});
});

const sorted=Object.entries(ranking).sort((a,b)=>b[1]-a[1]);

document.getElementById("ranking").innerHTML=sorted.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");
}

load();
</script>
</body>
</html>
